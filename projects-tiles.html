<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300..800;1,300..500&display=swap" rel="stylesheet">
<title>Map fades → tiles arrive → wheels</title>
</head>
<body>

<!-- PROTOTYPE. The map is not broken into the tiles: it simply leaves, and the
     work arrives from depth in its place. One idea on screen at a time. -->
<div class="tilefield" id="tfStage">
  <div class="tilefield__map" id="tfMap"></div>
</div>

<div class="tf-hud">
  <a href="/">&larr; site</a>
  <span class="tf-hud__beat" id="tfBeat">THE MAP</span>
  <input id="tfP" type="range" min="0" max="1000" value="0" aria-label="Sequence progress">
  <span>drag or scroll · push the tiles with the pointer while they float</span>
</div>

<script type="module" src="/src/lab-tiles.js"></script>
</body>
</html>
