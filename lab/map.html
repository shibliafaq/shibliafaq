<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Village composition test</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #09090b; color: #dcdce0; font-family: "Jost", system-ui, sans-serif; padding: 1.5rem; }
  h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: .3rem; }
  .sub { color: #9a9aa3; font-size: .82rem; margin-bottom: 1.2rem; max-width: 68ch; line-height: 1.55; }
  .row { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { margin-top: .6rem; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: #f59e0b; }
  canvas { display: block; image-rendering: pixelated; border: 1px solid rgba(255,255,255,.12); border-radius: 6px; }
</style>
</head>
<body>

<h1>Village composition — CC0 tileset</h1>
<p class="sub">
  Same map, three grades. The grade is a CSS filter on the canvas, so the
  artist's shading and dithering survive intact — no tile is repainted.
</p>

<div class="row" id="row"></div>

<script type="module">
import { TileMap, TILE, loadSheet, GRADES } from '/src/modules/pixel/tilemap.js';

const COLS = 30, ROWS = 34, SCALE = 2;

// ---- tile vocabulary, read off lab/tiles.html ----
const T = {
  grass:     [[5, 9], [6, 9], [5, 10], [6, 10]],
  grassFlor: [[0, 8], [1, 8]],
  water:     [[17, 1], [18, 1], [17, 2], [18, 2]],
  waveTop:   [[0, 1], [1, 1], [2, 1], [3, 1]],
  dirt:      [[5, 20], [6, 20], [5, 21], [6, 21]],
  rock:      [[6, 5], [7, 5], [8, 5]],
  log:       [4, 5],
  fence:     [[0, 15], [1, 15], [2, 15]],
};

const map = new TileMap(COLS, ROWS);

// ground
map.fill('ground', 0, 0, COLS, ROWS, T.grass, 4);
map.scatter('ground', 0, 0, COLS, ROWS, T.grassFlor, 26, 9);

// river across the lower third
map.fill('ground', 0, 24, COLS, 5, T.water, 6);
map.fill('overlay', 0, 23, COLS, 1, T.waveTop, 8);

// paths
map.fill('overlay', 13, 0, 3, 24, T.dirt, 12);
map.fill('overlay', 13, 29, 3, ROWS - 29, T.dirt, 13);
map.fill('overlay', 5, 12, 9, 2, T.dirt, 14);

// buildings — 5x5 blocks lifted straight from the sheet
map.blit('objects', 3, 4, 6, 0, 5, 5);
map.blit('objects', 19, 3, 11, 0, 5, 5);
map.blit('objects', 20, 15, 6, 0, 5, 5);

// scatter
map.scatter('objects', 0, 0, 12, 22, T.rock, 10, 21);
map.set('objects', 8, 19, T.log);
map.fill('objects', 2, 20, 3, 1, T.fence, 22);

// ---- render ----
const sheet = await loadSheet('/assets/pixel/overworld.webp');
const row = document.getElementById('row');

for (const [name, grade] of [['Ungraded', GRADES.none], ['Muted', GRADES.muted], ['Deep', GRADES.deep]]) {
  const canvas = document.createElement('canvas');
  canvas.width = COLS * TILE;
  canvas.height = ROWS * TILE;
  canvas.style.width = `${COLS * TILE * SCALE}px`;
  canvas.style.height = `${ROWS * TILE * SCALE}px`;
  canvas.style.filter = grade;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  map.render(ctx, sheet);

  const fig = document.createElement('figure');
  fig.appendChild(canvas);
  const cap = document.createElement('figcaption');
  cap.textContent = name;
  fig.appendChild(cap);
  row.appendChild(fig);
}
</script>
</body>
</html>
