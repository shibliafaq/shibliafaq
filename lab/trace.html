<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>Trace the road &amp; place the stops</title>
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:#111;color:#eee;font:13px/1.5 system-ui;padding:10px}
 .bar{position:fixed;top:0;left:0;right:0;background:#181818;padding:8px 12px;z-index:9;
      display:flex;gap:10px;align-items:center;border-bottom:1px solid #333}
 button{background:#f59e0b;border:0;color:#111;font-weight:700;padding:6px 12px;border-radius:5px;cursor:pointer}
 button.alt{background:#333;color:#eee}
 #wrap{margin-top:52px;position:relative;display:inline-block}
 canvas{display:block;image-rendering:pixelated;cursor:crosshair}
 #out{position:fixed;right:10px;bottom:10px;width:360px;height:220px;background:#000;color:#7f7;
      font:11px/1.35 ui-monospace,monospace;padding:8px;border:1px solid #333;overflow:auto;white-space:pre-wrap}
 .hint{color:#999}
</style></head><body>
<div class="bar">
  <button id="mRoad">Road</button>
  <button class="alt" id="mStops">Stops</button>
  <button class="alt" id="mPeople">People</button>
  <button class="alt" id="mAnimals">Animals</button>
  <select id="art" title="who to place"></select>
  <span id="who"><b>Click along the road, top to bottom.</b></span>
  <span class="hint">right-click = undo</span>
  <button id="save">Save</button>
  <button class="alt" id="clear">Clear</button>
  <button class="alt" id="load">Load current</button>
  <span id="count" class="hint"></span>
</div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="out">click the road…</div>
<script type="module">
const MAP = '/assets/pixel/final';
const img = new Image(); img.src = `${MAP}/base_map.png`;
await img.decode();
const c = document.getElementById('c'), x = c.getContext('2d');
const SCALE = 1;                       // 1:1 so a click IS a map pixel
c.width = img.width * SCALE; c.height = img.height * SCALE;

let pts = [];      // road waypoints
let stops = [];    // milestones, in walking order
let npcs = [];     // people, each with a patrol from->to
let animals = [];  // livestock, same shape
let pending = null;   // first click of a from->to pair
let mode = 'road';

// Everyone available. `kind` decides which list an entry lands in, because the
// two are drawn from different sheets and animals move at a third the speed.
const CAST = [
  ['villager_a', 'person', 'Villager A'],
  ['villager_b', 'person', 'Villager B'],
  ['villager_c', 'person', 'Villager C'],
  ['villager_hold', 'person', 'Villager, holding'],
  ['villager_carry', 'person', 'Villager, carrying'],
  ['villager_rogue', 'person', 'Rogue'],
  ['villager_knight', 'person', 'Knight'],
  ['villager_wizard', 'person', 'Wizard'],
  ['animal_cow', 'animal', 'Cow'],
  ['animal_sheep', 'animal', 'Sheep'],
  ['animal_chicken', 'animal', 'Chicken'],
];
const artSel = document.getElementById('art');
/** Only ever offer the cast that belongs to the current mode. */
function fillCast() {
  const want = mode === 'animals' ? 'animal' : 'person';
  artSel.innerHTML = '';
  CAST.forEach(([id, kind, label], i) => {
    if (kind !== want) return;
    const o = document.createElement('option');
    o.value = String(i); o.textContent = label;
    artSel.appendChild(o);
  });
  artSel.style.display = (mode === 'people' || mode === 'animals') ? '' : 'none';
}

// The seven milestones in the order they are walked. Each click assigns the next
// one still unplaced, so you just click them in story order.
const ORDER = [
  ['barch',       'BIT Mesra — the cathedral'],
  ['chadda',      'Chadda & Associates'],
  ['metarch1',    'Metarch Studios'],
  ['jaiswal',     'Jaiswal & Associates'],
  ['medicfibers', 'Medicfibers'],
  ['metarch2',    'Metarch Studios (return)'],
  ['kfupm',       'KFUPM — desert institution'],
];

const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

/** Snap a click to the nearest road waypoint. The walker has to stand ON the
    path or his distance along it is undefined — so you can click near a door
    and it lands him on the road outside it. */
function snap(p) {
  if (!pts.length) return { i: 0, pt: p };
  let bi = 0, bd = Infinity;
  pts.forEach((q, i) => { const d = dist(q, p); if (d < bd) { bd = d; bi = i; } });
  return { i: bi, pt: pts[bi] };
}
function cumAt(i) { let s = 0; for (let k = 1; k <= i; k++) s += dist(pts[k - 1], pts[k]); return s; }

function draw() {
  x.imageSmoothingEnabled = false;
  x.clearRect(0, 0, c.width, c.height);
  x.drawImage(img, 0, 0, c.width, c.height);

  x.strokeStyle = '#ff2fb0'; x.lineWidth = 3; x.beginPath();
  pts.forEach((p, i) => (i ? x.lineTo(p[0] * SCALE, p[1] * SCALE) : x.moveTo(p[0] * SCALE, p[1] * SCALE)));
  x.stroke();
  x.fillStyle = '#fff';
  pts.forEach((p) => { x.beginPath(); x.arc(p[0] * SCALE, p[1] * SCALE, 3, 0, 7); x.fill(); });

  stops.forEach((s, i) => {
    x.fillStyle = '#22d3ee'; x.beginPath();
    x.arc(s.stand[0] * SCALE, s.stand[1] * SCALE, 10, 0, 7); x.fill();
    x.fillStyle = '#000'; x.font = 'bold 13px system-ui'; x.textAlign = 'center';
    x.fillText(String(i + 1), s.stand[0] * SCALE, s.stand[1] * SCALE + 4);
  });

  [...npcs, ...animals].forEach((n) => {
    const isAnimal = animals.includes(n);
    x.strokeStyle = isAnimal ? '#4ade80' : '#f59e0b';
    x.lineWidth = 2; x.beginPath();
    x.moveTo(n.from[0] * SCALE, n.from[1] * SCALE);
    x.lineTo(n.to[0] * SCALE, n.to[1] * SCALE); x.stroke();
    [n.from, n.to].forEach((q, k) => {
      x.fillStyle = k ? '#000' : (isAnimal ? '#4ade80' : '#f59e0b');
      x.strokeStyle = isAnimal ? '#4ade80' : '#f59e0b';
      x.beginPath(); x.arc(q[0] * SCALE, q[1] * SCALE, 5, 0, 7);
      x.fill(); x.stroke();
    });
  });
  if (pending) {
    x.fillStyle = '#fff';
    x.beginPath(); x.arc(pending.from[0] * SCALE, pending.from[1] * SCALE, 6, 0, 7); x.fill();
  }

  const next = ORDER[stops.length];
  const who = document.getElementById('who');
  if (mode === 'road') who.innerHTML = '<b>Click along the road, top to bottom.</b>';
  else if (mode === 'stops') who.innerHTML = next
    ? `<b>Click where he stands for: ${next[1]}</b>` : '<b>All seven placed.</b>';
  else {
    const noun = mode === 'animals' ? 'the animal' : 'the person';
    who.innerHTML = pending
      ? `<b>Now click where ${noun} walks TO.</b>`
      : `<b>Click where ${noun} starts.</b> <span class="hint">two clicks = one patrol</span>`;
  }

  document.getElementById('count').textContent =
    mode === 'road' ? `${pts.length} road points`
    : mode === 'stops' ? `${stops.length}/7 stops`
    : mode === 'people' ? `${npcs.length} people placed`
    : `${animals.length} animals placed`;

  document.getElementById('out').textContent =
    mode === 'road' ? JSON.stringify(pts)
    : mode === 'stops'
      ? stops.map((s, i) => `${i + 1} ${s.id.padEnd(12)} at=${Math.round(s.at)} (${s.stand})`).join('\n')
      : [...npcs.map((n) => `person ${CAST[n.cast][2].padEnd(20)} ${n.from} -> ${n.to}`),
         ...animals.map((n) => `animal ${CAST[n.cast][2].padEnd(20)} ${n.from} -> ${n.to}`)].join('\n');
}

c.addEventListener('click', (e) => {
  const r = c.getBoundingClientRect();
  const p = [Math.round((e.clientX - r.left) / SCALE), Math.round((e.clientY - r.top) / SCALE)];
  if (mode === 'road') { pts.push(p); pts.sort((a, b) => a[1] - b[1]); }
  else if (mode === 'stops') {
    if (stops.length >= ORDER.length) return;
    const { i, pt } = snap(p);
    const [id, label] = ORDER[stops.length];
    stops.push({ id, label, at: cumAt(i), stand: [pt[0], pt[1]] });
  } else {
    // two clicks make one patrol: where they start, then where they walk to
    if (!pending) { pending = { from: p }; }
    else {
      const ci = Number(artSel.value);
      const [id, kind] = CAST[ci];   // kind follows the mode, the select is filtered
      // index within its own sheet list, which is what walkmap.js expects
      const idx = CAST.filter((c) => c[1] === kind).findIndex((c) => c[0] === id);
      const entry = { from: pending.from, to: p, art: idx, cast: ci,
                      speed: kind === 'animal' ? 0.25 : 0.7 };
      (kind === 'animal' ? animals : npcs).push(entry);
      pending = null;
    }
  }
  draw();
});
c.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (mode === 'road') pts.pop();
  else if (mode === 'stops') stops.pop();
  else if (pending) pending = null;
  else if (mode === 'animals') animals.pop();
  else npcs.pop();
  draw();
});

document.getElementById('mRoad').onclick = () => {
  setMode('road');
};
document.getElementById('mStops').onclick = () => {
  setMode('stops');
};
function setMode(m) {
  mode = m; pending = null;
  for (const [id, val] of [['mRoad', 'road'], ['mStops', 'stops'],
                           ['mPeople', 'people'], ['mAnimals', 'animals']])
    document.getElementById(id).className = (val === m ? '' : 'alt');
  fillCast(); draw();
}
document.getElementById('mPeople').onclick = () => setMode('people');
document.getElementById('mAnimals').onclick = () => setMode('animals');
document.getElementById('clear').onclick = () => {
  if (mode === 'road') pts = [];
  else if (mode === 'stops') stops = [];
  else if (mode === 'animals') { animals = []; pending = null; }
  else { npcs = []; pending = null; }
  draw();
};
document.getElementById('load').onclick = async () => {
  pts = (await (await fetch(`${MAP}/road_path.json`)).json()).points;
  const cur = await (await fetch(`${MAP}/stops.json`)).json();
  stops = cur.stops.map((s) => ({ id: s.id, label: s.id, at: s.at, stand: s.stand }));
  try {
    const n = await (await fetch(`${MAP}/npcs.json`)).json();
    npcs = n.npcs || []; animals = n.animals || [];
  } catch { /* none placed yet */ }
  draw();
};

document.getElementById('save').onclick = async () => {
  let url, body;
  if (mode === 'road') {
    url = '/__save-road';
    body = { map: [img.width, img.height], units: 'map pixels', note: 'hand-traced', points: pts };
  } else if (mode === 'people' || mode === 'animals') {
    url = '/__save-npcs';
    body = { map: [img.width, img.height], npcs, animals };
  } else {
    if (stops.length < ORDER.length) {
      document.getElementById('out').textContent = `place all 7 first (${stops.length}/7)`;
      return;
    }
    // carry the verbatim timeline copy already in stops.json
    const cur = await (await fetch(`${MAP}/stops.json`)).json();
    const copy = Object.fromEntries(cur.stops.map((s) => [s.id,
      Object.fromEntries(['period', 'role', 'org', 'note'].filter((k) => k in s).map((k) => [k, s[k]]))]));
    let total = 0;
    for (let k = 1; k < pts.length; k++) total += dist(pts[k - 1], pts[k]);
    url = '/__save-stops';
    body = {
      path_length: Math.round(total), map: [img.width, img.height], enter_r: 60, exit_r: 90,
      stops: stops.map((s) => ({
        id: s.id, at: Math.round(s.at * 10) / 10, stand: s.stand, ...(copy[s.id] || {}),
      })),
    };
  }
  const r = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  document.getElementById('out').textContent = r.ok
    ? `saved ${mode === 'road' ? 'road_path.json' : mode === 'stops' ? 'stops.json' : 'npcs.json'}`
    : 'save endpoint not running; copy this instead\n' + JSON.stringify(body);
};

// start with the current road loaded — you are usually adjusting, not starting over
pts = (await (await fetch(`${MAP}/road_path.json`)).json()).points;
draw();
</script></body></html>
