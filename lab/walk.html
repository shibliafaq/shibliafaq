<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experience map — the walk</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #09090b; color: #dcdce0; font-family: "Jost", system-ui, sans-serif; }

  .scroller { position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  canvas { display: block; image-rendering: pixelated; }

  .walkcard {
    position: absolute; left: 50%; bottom: 8vh; transform: translate(-50%, 14px);
    width: min(90vw, 30rem); padding: 1rem 1.15rem;
    background: rgba(14,14,17,.94); backdrop-filter: blur(16px);
    border: 1px solid rgba(245,158,11,.42); border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    opacity: 0; transition: opacity .18s ease-out, transform .18s ease-out;
  }
  .walkcard.is-in { opacity: 1; transform: translate(-50%, 0); }
  .walkcard em { display: block; font-style: normal; color: #f59e0b; font-weight: 600;
                 font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; margin-bottom: .35rem; }
  .walkcard b { display: block; font-size: 1rem; font-weight: 600; line-height: 1.25; }
  .walkcard span { display: block; color: #9a9aa3; font-size: .8rem; margin-top: .15rem; }
  .walkcard p { color: #dcdce0; font-size: .78rem; line-height: 1.6; margin-top: .6rem; }

  .hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 5;
          font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; color: #6d6d77; }
</style>
</head>
<body>

<p class="hint">Scroll — he walks</p>

<div class="scroller" id="scroller">
  <div class="stage" id="stage">
    <canvas></canvas>
    <div data-cards></div>
  </div>
</div>

<script type="module">
import { initWalk } from '/src/modules/pixel/walk.js';
const info = await initWalk(document.getElementById('stage'));
console.log('walk ready', info);
window.__walk = info;
</script>
</body>
</html>
